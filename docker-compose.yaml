services:
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks:
      - lumio

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    networks:
      - lumio
    volumes:
      - ./lumio/data:/app/data
  nginx:
    build: ./nginx
    depends_on:
      - frontend
    ports:
      - "443:443"
    networks:
      - lumio

networks:
  lumio:
    driver: bridge