services:
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks:
      - lumio

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    networks:
      - lumio
    volumes:
    - lumio_data:/app/data

networks:
  lumio:
    driver: bridge

volumes:
  lumio_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/backend/data